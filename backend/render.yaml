# Render blueprint for the AIRINDEX backend.
# Create the service from the Render dashboard ("New +" -> "Blueprint") pointed at
# this repo, or configure a Web Service manually with the settings below.
services:
  - type: web
    name: airindex-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_NAME
        value: airfare_index
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "720"
      - key: DEMO_USER_EMAIL
        value: analyst@airindex.dev
      - key: DEMO_USER_PASSWORD
        sync: false
      - key: AMADEUS_CLIENT_ID
        sync: false
      - key: AMADEUS_CLIENT_SECRET
        sync: false
      - key: AMADEUS_BASE_URL
        value: https://test.api.amadeus.com
      - key: COLLECTION_ENABLED
        value: "false"
      - key: COLLECTION_INTERVAL_MINUTES
        value: "60"
      - key: CORS_ORIGINS
        sync: false # set to your Vercel URL, e.g. https://airindex.vercel.app
